services:
  # Use the internal proxy to route /api, /god-mode, /spaces, and / (web)
  # This mimics production routing on a single port.
  plane-proxy:
    ports:
      - "8080:80"

  plane-minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  n8n:
    ports:
      - "5678:5678"

  rocketchat:
    ports:
      - "3000:3000"

  # Optional: Expose Headplane UI locally for inspection
  # headplane:
  #   ports:
  #     - "3001:3000"

  # Disable the Edge Caddy in local (we access services directly via ports above)
  caddy:
    profiles: ["prodonly"]