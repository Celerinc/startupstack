name: startupstack

networks:
  edge:
  internal:

volumes:
  # Plane
  plane_pg_data:
  plane_minio_data:
  # n8n
  n8n_data:
  # Rocket.Chat
  rocketchat_mongo_data:
  rocketchat_uploads:
  # Caddy
  caddy_data:
  caddy_config:
  # ClickHouse (optional)
  # clickhouse_data:

services:
  # -----------------
  # EDGE PROXY (Caddy)
  # -----------------
  caddy:
    image: caddy:2.8.4
    networks: [edge, internal]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # -----------------
  # PLANE
  # -----------------
  plane-db:
    image: postgres:16
    environment:
      POSTGRES_DB: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: ${PLANE_DB_PASSWORD}
    volumes:
      - plane_pg_data:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped

  plane-redis:
    image: redis:7
    networks: [internal]
    restart: unless-stopped

  plane-minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - plane_minio_data:/data
    networks: [internal]
    restart: unless-stopped

  plane-proxy:
    image: makeplane/plane-proxy:${PLANE_VERSION}
    volumes:
      - ./plane-proxy.Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - plane-web
      - plane-admin
      - plane-space
      - plane-api
    networks: [internal]
    restart: unless-stopped

  plane-api:
    image: makeplane/plane-backend:${PLANE_VERSION}
    environment:
      DATABASE_URL: postgres://plane:${PLANE_DB_PASSWORD}@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379
      CELERY_BROKER_URL: redis://plane-redis:6379/0
      CELERY_RESULT_BACKEND: redis://plane-redis:6379/0
      SECRET_KEY: ${PLANE_SECRET_KEY}
      PLANE_BUCKET: ${PLANE_BUCKET}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_S3_ENDPOINT_URL: ${MINIO_ENDPOINT_URL}
      AWS_STORAGE_BUCKET_NAME: ${PLANE_BUCKET}
      AWS_S3_BUCKET_NAME: ${PLANE_BUCKET}
      AWS_S3_REGION_NAME: us-east-1
      WEB_URL: ${PLANE_WEB_URL}
      APP_BASE_URL: ${PLANE_APP_BASE_URL}
      ADMIN_BASE_URL: ${PLANE_ADMIN_BASE_URL}
      SPACE_BASE_URL: ${PLANE_SPACE_BASE_URL}
      GUNICORN_WORKERS: ${PLANE_GUNICORN_WORKERS}
      ENABLE_SIGNUP: ${PLANE_ENABLE_SIGNUP}
      ENABLE_EMAIL_PASSWORD: ${PLANE_ENABLE_EMAIL_PASSWORD}
      DISABLE_WORKSPACE_CREATION: ${PLANE_DISABLE_WORKSPACE_CREATION}
      CSRF_TRUSTED_ORIGINS: ${PLANE_WEB_URL}
      CORS_ALLOWED_ORIGINS: ${PLANE_WEB_URL}
      SECURE_PROXY_SSL_HEADER: HTTP_X_FORWARDED_PROTO,https
    depends_on: [plane-db, plane-redis, plane-minio]
    networks: [internal]
    restart: unless-stopped

  # (Optional but recommended for real usage)
  plane-worker:
    image: makeplane/plane-backend:${PLANE_VERSION}
    command: ["/code/bin/docker-entrypoint-worker.sh"]
    environment:
      DATABASE_URL: postgres://plane:${PLANE_DB_PASSWORD}@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379
      SECRET_KEY: ${PLANE_SECRET_KEY}
      PLANE_BUCKET: ${PLANE_BUCKET}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_STORAGE_BUCKET_NAME: ${PLANE_BUCKET}
      AWS_S3_BUCKET_NAME: ${PLANE_BUCKET}
      AWS_S3_REGION_NAME: us-east-1
      WEB_URL: ${PLANE_WEB_URL}
      APP_BASE_URL: ${PLANE_APP_BASE_URL}
      ADMIN_BASE_URL: ${PLANE_ADMIN_BASE_URL}
      SPACE_BASE_URL: ${PLANE_SPACE_BASE_URL}
      GUNICORN_WORKERS: ${PLANE_GUNICORN_WORKERS}
    depends_on: [plane-api]
    networks: [internal]
    restart: unless-stopped
    # If Plane's backend image expects a worker command, put it here:
    # command: ["./bin/worker"]

  plane-web:
    image: makeplane/plane-frontend:${PLANE_VERSION}
    environment:
      WEB_URL: ${PLANE_WEB_URL}
      APP_BASE_URL: ${PLANE_APP_BASE_URL}
      ADMIN_BASE_URL: ${PLANE_ADMIN_BASE_URL}
      SPACE_BASE_URL: ${PLANE_SPACE_BASE_URL}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
      NEXT_PUBLIC_APP_BASE_URL: ${NEXT_PUBLIC_APP_BASE_URL}
      NEXT_PUBLIC_ADMIN_BASE_URL: ${NEXT_PUBLIC_ADMIN_BASE_URL}
      NEXT_PUBLIC_SPACE_BASE_URL: ${NEXT_PUBLIC_SPACE_BASE_URL}
    depends_on: [plane-api]
    networks: [internal]
    restart: unless-stopped

  plane-admin:
    image: makeplane/plane-admin:${PLANE_VERSION}
    environment:
      WEB_URL: ${PLANE_WEB_URL}
      APP_BASE_URL: ${PLANE_APP_BASE_URL}
      ADMIN_BASE_URL: ${PLANE_ADMIN_BASE_URL}
      SPACE_BASE_URL: ${PLANE_SPACE_BASE_URL}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
      NEXT_PUBLIC_APP_BASE_URL: ${NEXT_PUBLIC_APP_BASE_URL}
      NEXT_PUBLIC_ADMIN_BASE_URL: ${NEXT_PUBLIC_ADMIN_BASE_URL}
      NEXT_PUBLIC_SPACE_BASE_URL: ${NEXT_PUBLIC_SPACE_BASE_URL}
    depends_on: [plane-api, plane-web]
    networks: [internal]
    restart: unless-stopped

  plane-space:
    image: makeplane/plane-space:${PLANE_VERSION}
    environment:
      WEB_URL: ${PLANE_WEB_URL}
      APP_BASE_URL: ${PLANE_APP_BASE_URL}
      ADMIN_BASE_URL: ${PLANE_ADMIN_BASE_URL}
      SPACE_BASE_URL: ${PLANE_SPACE_BASE_URL}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
      NEXT_PUBLIC_APP_BASE_URL: ${NEXT_PUBLIC_APP_BASE_URL}
      NEXT_PUBLIC_ADMIN_BASE_URL: ${NEXT_PUBLIC_ADMIN_BASE_URL}
      NEXT_PUBLIC_SPACE_BASE_URL: ${NEXT_PUBLIC_SPACE_BASE_URL}
    depends_on: [plane-api, plane-worker, plane-web]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/spaces/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  # -----------------
  # N8N
  # -----------------
  n8n:
    image: n8nio/n8n:${N8N_VERSION}
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      GENERIC_TIMEZONE: Europe/Paris
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # strongly recommended if you later add postgres for n8n:
      # DB_TYPE: postgresdb
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [internal]
    restart: unless-stopped

  # -----------------
  # ROCKET.CHAT + MONGODB (single-node replica set)
  # -----------------
  rocketchat-mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - rocketchat_mongo_data:/data/db
    networks: [internal]
    restart: unless-stopped

  rocketchat-mongo-init:
    image: mongo:7
    depends_on: [rocketchat-mongo]
    networks: [internal]
    restart: "no"
    command: >
      bash -lc "mongosh --host rocketchat-mongo:27017 --eval '
      try { rs.status() } catch(e) { rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"rocketchat-mongo:27017\"}]}) }
      '"

  rocketchat:
    image: rocketchat/rocket.chat:6.7.0
    depends_on: [rocketchat-mongo-init]
    environment:
      MONGO_URL: mongodb://rocketchat-mongo:27017/rocketchat?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://rocketchat-mongo:27017/local?replicaSet=rs0
      ROOT_URL: ${ROCKETCHAT_ROOT_URL}
      PORT: 3000
      OVERWRITE_SETTING_Accounts_RegistrationForm: "Disabled"
    volumes:
      - rocketchat_uploads:/app/uploads
    networks: [internal]
    restart: unless-stopped

  # -----------------
  # CLICKHOUSE (optional)
  # -----------------
  # clickhouse:
  #   image: clickhouse/clickhouse-server:24.10
  #   profiles: ["analytics"]
  #   environment:
  #     CLICKHOUSE_DB: ${CLICKHOUSE_DB}
  #     CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  #     CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  #   volumes:
  #     - clickhouse_data:/var/lib/clickhouse
  #   networks: [internal]
  #   restart: unless-stopped